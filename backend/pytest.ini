[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
pythonpath = .
markers =
    slow: marks tests as slow
    integration: marks integration tests
    e2e: marks end-to-end tests

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "app/core/logging.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
