name: DocuFlow CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/docuflow-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/docuflow-frontend
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps (Tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng libgl1-mesa-glx

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        env:
          ENV: development
          RATE_LIMIT_ENABLED: "false"
          METRICS_ENABLED: "false"
          JWT_SECRET: "ci-test-secret-key-32-chars-long!!"
          SECRET_KEY: "ci-app-secret-key-32-chars-long!!!"
          REDIS_URL: "redis://localhost:6379/15"
          LOG_FORMAT: "text"
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/

  # ── Security Scan ────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety semgrep

      - name: Run Bandit (SAST)
        working-directory: backend
        run: |
          bandit -r app/ -f json -o bandit-report.json -ll || true
          bandit -r app/ -ll --exit-zero

      - name: Run Safety (dependency vulnerabilities)
        working-directory: backend
        run: safety check -r requirements.txt --full-report || true

      - name: Run Trivy (container vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          severity: CRITICAL,HIGH
          exit-code: 0

  # ── Frontend Tests ───────────────────────────────────────────────────
  test-frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present || true

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Docker Build ─────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-22.04
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: [build-images]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.docuflow.io

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to staging
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          export KUBECONFIG=kubeconfig.yaml
          helm upgrade --install docuflow infrastructure/kubernetes/helm/docuflow \
            --namespace docuflow-staging \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --set env=staging \
            --values infrastructure/kubernetes/helm/docuflow/values-staging.yaml \
            --wait --timeout=10m

      - name: Run smoke tests
        run: |
          STAGING_URL=https://staging-api.docuflow.io
          curl -f "$STAGING_URL/health" || exit 1
          curl -f "$STAGING_URL/v2/health" | grep -q '"status":"healthy"' || exit 1
          echo "Smoke tests passed"

  # ── Deploy to Production ─────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    needs: [build-images]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://docuflow.io

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig (production)
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to production (rolling update)
        env:
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          export KUBECONFIG=kubeconfig.yaml
          helm upgrade --install docuflow infrastructure/kubernetes/helm/docuflow \
            --namespace docuflow \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --set env=production \
            --values infrastructure/kubernetes/helm/docuflow/values-production.yaml \
            --atomic --timeout=15m \
            --cleanup-on-fail

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "DocuFlow ${{ github.event.release.tag_name }} deployed to production",
              "blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": ":rocket: *DocuFlow ${{ github.event.release.tag_name }}* deployed to production by ${{ github.actor }}"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
