name: DocuFlow CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/docuflow-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/docuflow-frontend

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docuflow_test
          POSTGRES_USER: docuflow
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (Tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng libgl1-mesa-glx

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install ruff
          ruff check app/ --ignore E501,E402

      - name: Run type checking
        run: |
          pip install mypy types-passlib
          mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Run tests with coverage
        env:
          ENV: development
          DATABASE_URL: postgresql+asyncpg://docuflow:testpass@localhost:5432/docuflow_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          SECRET_KEY: ci-test-app-secret-not-for-production
          RATE_LIMIT_ENABLED: "false"
          METRICS_ENABLED: "false"
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        if: github.ref == 'refs/heads/main'

      - name: Run Alembic check
        env:
          DATABASE_URL: postgresql+psycopg2://docuflow:testpass@localhost:5432/docuflow_test
        run: alembic upgrade head

  # ── Frontend Tests ─────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present || true

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck 2>/dev/null || true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Check bundle size
        run: du -sh dist/ && ls -la dist/assets/

  # ── Security Scan ──────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ── Build & Push Docker ────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: backend/
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.docuflow.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Deploy via Helm
        run: |
          helm upgrade --install docuflow ./infrastructure/kubernetes/helm \
            --namespace docuflow-staging --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set env=staging \
            --set api.replicas=2 \
            --set worker.minReplicas=2 \
            --set worker.maxReplicas=20 \
            --atomic --timeout=10m \
            --wait

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/docuflow-api -n docuflow-staging
          kubectl rollout status deployment/docuflow-worker -n docuflow-staging

      - name: Run smoke tests
        run: |
          sleep 10
          curl -f https://staging.docuflow.io/health || exit 1
          echo "Smoke test passed"

  # ── Deploy to Production ───────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.docuflow.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (production)
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Rolling deploy via Helm
        run: |
          helm upgrade docuflow ./infrastructure/kubernetes/helm \
            --namespace docuflow --reuse-values \
            --set image.tag=${{ github.sha }} \
            --atomic --timeout=15m \
            --wait

      - name: Verify production deployment
        run: |
          kubectl rollout status deployment/docuflow-api -n docuflow --timeout=300s
          curl -f https://api.docuflow.io/health
          echo "Production deployment successful"

      - name: Notify on success
        if: success()
        run: |
          echo "Deployment ${{ github.sha }} to production successful"
